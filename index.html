<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <section class="contact">
      <div class="form_container">
        <div class="input_group">
              <input id="username" class="inputBox" type="text" name="username" placeholder="enter your name">
              <span id="nameError" class="error"></span>

        </div>
        <div class="input_group">
              <input id="email" class="inputBox" type="email" name="email" placeholder="enter your email">
              <span id="emailError" class="error"></span>

        </div>
        <div class="input_group">
              <input id="password" class="inputBox" type="password" name="password" placeholder="enter your password">
              <span id="passError" class="error"></span>

        </div>
        <div class="input_group">
              <input id="confirmpassword" class="inputBox" type="password" name="confirmpassword" placeholder="enter your confirmpassword">
              <span id="cpassError" class="error"></span>

        </div>
        <div class="input_group">
            <h3>Select Your Gender</h3>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>

            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>

            <input type="radio" name="gender" id="other">
            <label for="other">Other</label>

        </div>
        <div class="input_group">
            <h3>Choose Your Favourite Language</h3>
            <input type="checkbox" id="java">
            <label for="java">Javascript</label>

            <input type="checkbox" id="html">
            <label for="html">HTML</label>

            <input type="checkbox" id="css">
            <label for="css">CSS</label>
            <input type="checkbox" id="c">
            <label for="c">C</label>
        </div>
        <div class="input_group">
            Tell us more:
            <textarea class="mess" name="" id=""></textarea>
        </div>
        <div class="input_group">
            <button class="btn">Submit</button>
        </div>
      
      </div>
    </section>

    <script src="./js/script.js"></script>
  </body>
</html>
